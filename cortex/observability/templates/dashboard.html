<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cortex Runs</title>
  <style>
    :root { color-scheme: dark; --bg:#0b1020; --panel:#131b30; --muted:#91a0bd; --line:#283553; --good:#42d392; --bad:#ff6b7a; --accent:#76a8ff }
    * { box-sizing:border-box } body { margin:0; background:var(--bg); color:#eef3ff; font:14px system-ui,sans-serif }
    main { max-width:1180px; margin:auto; padding:32px 20px } h1 { margin:0 0 6px; font-size:28px } .sub,.metric { color:var(--muted) }
    .toolbar { margin:24px 0 18px } input { width:360px; max-width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:9px; background:var(--panel); color:inherit }
    .run { background:var(--panel); border:1px solid var(--line); border-radius:12px; margin:12px 0; overflow:hidden }
    .run>summary { cursor:pointer; padding:16px; list-style:none; display:grid; grid-template-columns:1fr repeat(4,auto); gap:18px; align-items:center }
    .id { font-family:ui-monospace,monospace; color:var(--accent) } .ok { color:var(--good) } .fail { color:var(--bad) }
    .events { border-top:1px solid var(--line); padding:8px 16px 16px } .event { display:grid; grid-template-columns:150px 100px 1fr; gap:10px; padding:9px 0; border-bottom:1px solid #202b45 }
    .overview { margin:12px 0; padding:14px; background:#0d1528; border-radius:9px; display:grid; gap:8px } .pill { display:inline-block; margin-right:8px; padding:3px 8px; border:1px solid var(--line); border-radius:99px } .flow { color:#cad5ea }
    pre { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; color:#cad5ea; font:12px ui-monospace,monospace }
    @media(max-width:700px) { .run>summary { grid-template-columns:1fr 1fr } .event { grid-template-columns:1fr } }
  </style>
</head>
<body><main>
  <h1>Cortex Run Traces</h1><div class="sub">Run 汇总、模型延迟、工具执行与 token 使用情况</div>
  <div class="toolbar"><input id="filter" placeholder="筛选 run id、结束原因或事件…"></div><section id="runs"></section>
</main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ms=n=>`${Number(n||0).toFixed(1)} ms`;
async function refresh(){
  const data=await fetch('/api/runs').then(r=>r.json()), q=document.querySelector('#filter').value.toLowerCase();
  document.querySelector('#runs').innerHTML=data.filter(r=>JSON.stringify(r).toLowerCase().includes(q)).map(r=>
    `<details class="run"><summary><span><b class="${r.success?'ok':'fail'}">${r.success?'SUCCESS':'FAILED'}</b><br><span class="id">${esc(r.run_id)}</span><br><small>${esc(r.termination_reason)}</small></span><span class="metric">${r.steps} steps</span><span class="metric">${r.total_tokens} tokens</span><span class="metric">LLM ${ms(r.llm_latency_ms)}</span><span class="metric">总计 ${ms(r.latency_ms)}</span></summary><div class="events"><div class="overview"><b>运行概要</b><span>Session: <span class="id">${esc(r.human_summary.session_id)}</span></span><span><i class="pill">Semantic Retrieval = ${r.human_summary.semantic_retrieval?'ON':'OFF'}</i><i class="pill">Episodic Retrieval = ${r.human_summary.episodic_retrieval?'ON':'OFF'}</i></span><span>Skill 检索: ${r.human_summary.skill_searched?'是':'否'} · 最终选择: ${esc(r.human_summary.selected_skills.join(', ')||'无')}</span><div class="flow">${r.human_summary.steps.map(s=>`${esc(s.phase)} → ${esc(s.summary)}${s.tools.filter(Boolean).length?' {'+esc(s.tools.filter(Boolean).join(', '))+'}':''}`).join('<br>')||'无执行步骤'}</div></div><details><summary>原始事件</summary>${r.events.map(e=>`<div class="event"><span>${esc(e.timestamp)}</span><b>${esc(e.event_type)}</b><pre>${esc(JSON.stringify(e.data,null,2))}</pre></div>`).join('')}</details></div></details>`).join('')||'<p class="sub">没有匹配的 Run。</p>';
}
document.querySelector('#filter').addEventListener('input',refresh); refresh(); setInterval(refresh,3000);
</script></body></html>
