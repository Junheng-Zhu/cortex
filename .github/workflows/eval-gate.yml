name: Cortex Eval Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    name: Eval Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: >-
          python -m pip install
          "openai>=1.66.0,<3"
          "pydantic>=2,<3"
          "python-dotenv>=1.0"
          "tenacity>=8.0"
          "pytest>=8.0"

      - name: Run Responses protocol tests
        run: >-
          python -m pytest -q
          tests/test_responses_protocol.py
          tests/test_tool_runtime.py
          tests/test_agent_multistep.py
          tests/test_context_engineering.py

      - name: Run deterministic Eval
        run: python eval/smoke_eval.py
